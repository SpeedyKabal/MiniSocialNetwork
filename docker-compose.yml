services:

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_backend
    # Dev server: auto-reloads on every file change (HTTP only)
    command: >
      /bin/sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount source code so edits are reflected instantly without rebuilding
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  daphne:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_daphne
    # Daphne handles WebSocket (Django Channels) connections
    command: daphne -b 0.0.0.0 -p 8001 backend.asgi:application
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react_frontend
    working_dir: /app/frontend
    # Vite dev server with HMR (hot module replacement)
    command: bun run dev --host 0.0.0.0
    volumes:
      # Mount source code so edits trigger HMR instantly
      - ./frontend:/app/frontend
      # Prevent host node_modules from overriding container's
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    depends_on:
      - backend
      - daphne
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/media:ro

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_celery
    # Celery worker — processes background tasks
    command: celery -A backend worker --loglevel=info
    volumes:
      - ./backend:/app
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  db_data:
  media_data:
