version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_RO0T_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
      - media_data:/app/backend/media
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      - db
      - redis
    network_mode: "host"  # Enables 127.0.0.1 access for Nginx

  daphne:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: daphne
    command: daphne -b 0.0.0.0 -p 8001 backend.asgi:application
    volumes:
      - ./backend:/app/backend
    env_file: .env
    depends_on:
      - backend
      - redis
    network_mode: "host"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
    network_mode: "host"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/backend/media
      - ./frontend/dist:/usr/share/nginx/html
    network_mode: "host"

volumes:
  mysql_data:
  media_data:
