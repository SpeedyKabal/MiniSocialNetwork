services:

  db:
    image: postgres:17-alpine
    container_name: postgresql-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published — only backend/daphne/celery need to reach it, over the internal compose network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    # No host port published, same reasoning

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_backend
    restart: always
    # Production: run migrations, collect static files, then serve with gunicorn (not the dev server)
    command: >
      /bin/sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # No ./backend:/app bind mount — code is baked into the image at build time
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - db
      - redis

  daphne:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_daphne
    restart: always
    command: daphne -b 0.0.0.0 -p 8001 backend.asgi:application
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react_frontend_build
    # Builds the static bundle, writes it to the shared volume, then exits — it never stays running
    command: sh -c "rm -rf /output/* && cp -r dist/. /output"
    volumes:
      - frontend_dist:/output

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    depends_on:
      backend:
        condition: service_started
      daphne:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/media:ro
      - static_data:/staticfiles:ro
      - frontend_dist:/usr/share/nginx/html:ro

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: django_celery
    restart: always
    command: celery -A backend worker --loglevel=info
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
  static_data:
  frontend_dist: